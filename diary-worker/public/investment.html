  <meta name="robots" content="noindex,nofollow,noarchive">

<body>
  <header class="investment-header">
    <a class="back-link" href="/diary/" aria-label="日記へ戻る">← <span>日記へ戻る</span></a>
    <p id="header-as-of" class="header-as-of">読み込み中</p>
  </header>

  <main class="investment-shell">
    <section class="investment-hero" aria-labelledby="investment-title">
      <div>
        <p class="eyebrow">Private portfolio</p>
        <h1 id="investment-title">My Investment<br>Performance</h1>
      </div>
    </section>

    <div id="loading-message" class="loading-message" role="status">資産データを読み込んでいます。</div>

    <div id="dashboard" hidden>
      <section class="kpi-grid" aria-label="資産状況">
        <article class="kpi-card kpi-primary">
          <p>資産総額</p>
          <strong id="current-total">—</strong>
        </article>
        <article class="kpi-card">
          <p id="change-label">期間中の増減</p>
          <strong id="period-change">—</strong>
        </article>
        <article class="kpi-card">
          <p id="rate-label">期間中の増減率</p>
          <strong id="period-rate">—</strong>
        </article>
        <article class="kpi-card">
          <p>過去最高</p>
          <strong id="all-time-high">—</strong>
          <span id="all-time-high-date" class="kpi-note"></span>
        </article>
      </section>

      <section class="dashboard-card chart-card" aria-labelledby="chart-title">
        <div class="section-head">
          <div>
            <p class="section-kicker">Asset history</p>
            <h2 id="chart-title">資産推移</h2>
          </div>
          <p id="chart-period" class="chart-period"></p>
        </div>

        <div id="range-controls" class="range-controls" aria-label="表示期間"></div>

        <div class="chart-wrap">
          <canvas id="asset-chart" role="img" aria-label="資産総額の推移"></canvas>
          <div id="chart-tooltip" class="chart-tooltip" hidden></div>
        </div>
        <p id="chart-summary" class="sr-only"></p>
        <div class="chart-legend"><span aria-hidden="true"></span>資産総額</div>
      </section>

      <section class="dashboard-card composition-card" aria-labelledby="composition-title">
        <div class="section-head">
          <div>
            <p class="section-kicker">Current allocation</p>
            <h2 id="composition-title">資産構成</h2>
          </div>
          <p id="composition-as-of" class="chart-period"></p>
        </div>
        <div class="composition-layout">
          <div class="donut-wrap">
            <canvas id="composition-chart" role="img" aria-label="最新の資産構成"></canvas>
            <div class="donut-center">
              <span>合計</span>
              <strong id="donut-total">—</strong>
            </div>
          </div>
          <div id="composition-list" class="composition-list"></div>
