<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>請求書管理システム</title>
  <link rel="stylesheet" href="./billing.css?v=billing-aaf3d6009006">
  <link rel="stylesheet" href="./troom-date-picker.css?v=billing-aaf3d6009006">
  <script src="./troom-date-picker.js?v=billing-aaf3d6009006" defer></script>
  <script src="./billing.js?v=billing-aaf3d6009006" defer></script>
  <meta name="troom-app-build" content="billing-aaf3d6009006">
  <meta name="troom-auto-update" content="enabled">
</head>
<body>
  <main>
    <section id="boot-view" class="login-view" aria-label="請求書管理システムを準備中" aria-busy="true">
      <div class="login-card">
        <p class="eyebrow">T-ROOM PRIVATE</p>
        <h1>請求書管理システム</h1>
        <p class="login-copy">安全なログイン状態を確認しています…</p>
      </div>
    </section>

    <section id="login-view" class="login-view" aria-labelledby="login-title" hidden>
      <div class="login-card">
        <p class="eyebrow">T-ROOM PRIVATE</p>
        <h1 id="login-title">請求書管理システム</h1>
        <p class="login-copy">IDとパスワードを入力してください。</p>
        <form id="login-form" class="form-stack">
          <label>ID<input id="login-id" name="loginId" type="text" autocomplete="username" required></label>
          <label>パスワード
            <span class="password-field">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required>
              <button id="password-toggle" class="icon-button password-toggle" type="button" aria-controls="login-password" aria-label="パスワードを表示" aria-pressed="false" title="パスワードを表示">
                <svg class="password-eye password-eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                <svg class="password-eye password-eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><path d="M4 4l16 16"/></svg>
              </button>
            </span>
          </label>
          <label class="remember-login"><input id="remember-login" type="checkbox" checked><span>ログインIDとパスワードを保存する</span></label>
          <p id="login-error" class="error-message" role="alert"></p>
          <button id="login-submit" class="button primary full" type="submit">ログイン</button>
        </form>
      </div>
    </section>

    <section id="app-view" class="app-view" hidden>
      <header class="app-header">
        <div>
          <p class="eyebrow">BILLING LEDGER</p>
          <h1>請求書管理システム</h1>
        </div>
        <div class="account-actions">
          <span id="account-label"></span>
          <button id="logout-button" class="text-button" type="button">ログアウト</button>
        </div>
      </header>

      <div class="toolbar no-print">
        <label id="account-select-label" hidden>発行先
          <select id="account-select"></select>
        </label>
        <label for="month-input">表示月
          <span class="date-input-shell">
            <input id="month-input" type="text" inputmode="none" readonly pattern="\d{4}-\d{2}" aria-haspopup="dialog" aria-controls="date-wheel-dialog">
            <button id="month-picker-button" class="date-picker-button" type="button" data-date-picker-target="month-input" data-date-picker-mode="month" aria-label="表示月をカレンダーから選ぶ" title="カレンダーから選ぶ">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12H4V7a2 2 0 0 1 2-2Z"/></svg>
            </button>
          </span>
        </label>
        <label>書類種別
          <select id="document-filter">
            <option value="invoice">請求書</option>
            <option value="payment_notice">支払通知書</option>
          </select>
        </label>
        <button id="print-button" class="button secondary" type="button">この月をPDF保存</button>
        <button id="new-entry-button" class="button primary owner-only" type="button" hidden>明細を追加</button>
        <button id="logs-button" class="button ghost owner-only" type="button" hidden>アカウント管理</button>
      </div>

      <section class="report" aria-live="polite">
        <div class="report-heading">
          <div>
            <p id="report-month" class="report-month"></p>
            <h2 id="document-title">請求書</h2>
            <p id="report-account" class="report-recipient"></p>
          </div>
          <div class="issuer-block">
            <p>発行人：田中宏知</p>
            <p class="print-date">出力日：<span id="print-date"></span></p>
          </div>
        </div>

        <div id="balance-grid" class="balance-grid">
          <article><span>前月繰越</span><strong id="opening-balance">—</strong></article>
          <button id="settlements-card" class="balance-card settlements-card no-print" type="button" aria-haspopup="dialog">
            <span>当月入出金</span>
            <span class="settlement-card-row"><small>入金</small><strong id="incoming-total">—</strong></span>
            <span class="settlement-card-row"><small>着金</small><strong id="outgoing-total">—</strong></span>
            <span class="settlement-card-link">履歴を見る</span>
          </button>
          <article><span>月末残高</span><strong id="closing-balance">—</strong></article>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>日付</th><th>区分</th><th>内容</th><th>備考</th><th class="amount">金額</th><th class="owner-only no-print"></th></tr></thead>
            <tbody id="entries-body"></tbody>
          </table>
          <p id="empty-message" class="empty-message">この月の明細はありません。</p>
        </div>
        <div id="document-summary" class="document-summary">
          <div class="document-summary-row document-summary-net"><span id="document-total-label">請求合計</span><strong id="document-total">—</strong></div>
        </div>
      </section>
    </section>
  </main>

  <dialog id="entry-dialog">
    <form id="entry-form" class="dialog-form">
      <div class="dialog-heading"><h2 id="entry-dialog-title">明細を追加</h2><button class="close-button" type="button" data-close-dialog="entry-dialog" aria-label="閉じる">×</button></div>
      <input id="entry-id" type="hidden">
      <input id="entry-record-type" type="hidden">
      <p class="form-section-title">発行先</p>
      <label>名前<select id="entry-account" required></select></label>
      <label id="entry-document-type-label">書類種別<select id="entry-document-type" required><option value="invoice">請求書</option><option value="payment_notice">支払通知書</option></select></label>
      <div class="date-field">
        <div class="date-field-head">
          <label for="entry-date">日付</label>
          <button id="today-button" class="today-button" type="button">本日</button>
        </div>
        <span class="date-input-shell">
          <input id="entry-date" type="text" inputmode="none" readonly required pattern="\d{4}-\d{2}-\d{2}" aria-haspopup="dialog" aria-controls="date-wheel-dialog">
          <button id="entry-date-picker-button" class="date-picker-button" type="button" data-date-picker-target="entry-date" data-date-picker-mode="date" aria-label="日付をカレンダーから選ぶ" title="カレンダーから選ぶ">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12H4V7a2 2 0 0 1 2-2Z"/></svg>
          </button>
        </span>
      </div>
      <label>区分<select id="entry-category" required></select></label>
      <label id="entry-description-label">内容<input id="entry-description" type="text" maxlength="100" required></label>
      <label id="settlement-direction-label" hidden>入金者
        <select id="settlement-direction">
          <option value="incoming">相手（発行先の本人）</option>
          <option value="outgoing">自分（田中宏知）</option>
        </select>
      </label>
      <label id="settlement-method-label" hidden>支払い方法
        <select id="settlement-method">
          <option value="bank_transfer">振込</option>
          <option value="cash">現金</option>
          <option value="other">その他</option>
        </select>
      </label>
      <label id="other-direction-label" hidden>その他の扱い<select id="other-direction"><option value="plus">請求</option><option value="minus">減額</option></select></label>
      <label>金額（1円単位）<input id="entry-amount" type="text" inputmode="numeric" maxlength="16" autocomplete="off" required></label>
      <label>備考<textarea id="entry-note" rows="3" maxlength="500"></textarea></label>
      <p id="entry-error" class="error-message" role="alert"></p>
      <div class="dialog-actions"><button class="button secondary" type="button" data-close-dialog="entry-dialog">キャンセル</button><button class="button primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="settlements-dialog" class="settlements-dialog">
    <div class="dialog-form">
      <div class="dialog-heading"><h2>入出金履歴</h2><button class="close-button" type="button" data-close-dialog="settlements-dialog" aria-label="閉じる">×</button></div>
      <p id="settlements-dialog-context" class="form-note"></p>
      <div class="logs-wrap"><table><thead><tr><th>日付</th><th>種別</th><th>支払い方法</th><th class="amount">金額</th><th>備考</th><th class="owner-only"></th></tr></thead><tbody id="settlements-body"></tbody></table></div>
    </div>
  </dialog>

  <dialog id="date-wheel-dialog" class="date-wheel-dialog" aria-labelledby="date-wheel-title">
    <section class="date-wheel-sheet">
      <header class="date-wheel-head">
        <button id="date-wheel-cancel" class="text-button" type="button">キャンセル</button>
        <div>
          <p id="date-wheel-title">日付を選択</p>
          <strong id="date-wheel-value"></strong>
        </div>
        <button id="date-wheel-done" class="text-button" type="button">完了</button>
      </header>
      <div id="date-wheel-window" class="date-wheel-window">
        <div class="date-wheel-highlight" aria-hidden="true"></div>
        <div class="date-wheel-group">
          <span>年</span>
          <div id="date-wheel-year" class="date-wheel-column" role="listbox" aria-label="年"></div>
        </div>
        <div class="date-wheel-group">
          <span>月</span>
          <div id="date-wheel-month" class="date-wheel-column" role="listbox" aria-label="月"></div>
        </div>
        <div id="date-wheel-day-group" class="date-wheel-group">
          <span>日</span>
          <div id="date-wheel-day" class="date-wheel-column" role="listbox" aria-label="日"></div>
        </div>
      </div>
    </section>
  </dialog>

  <dialog id="logs-dialog" class="logs-dialog">
    <div class="dialog-form">
      <div class="dialog-heading"><h2>アカウント管理</h2><button class="close-button" type="button" data-close-dialog="logs-dialog" aria-label="閉じる">×</button></div>
      <p class="form-note">アカウントのログイン・操作履歴です。管理者だけが閲覧できます。</p>
      <label class="logs-filter">表示対象
        <select id="logs-account-filter"><option value="">全体</option></select>
      </label>
      <div class="logs-wrap"><table><thead><tr><th>日時</th><th>操作</th><th>操作した人</th><th>対象者</th></tr></thead><tbody id="logs-body"></tbody></table></div>
    </div>
  </dialog>
  <script src="/assets/pwa-auto-update.js?v=billing-aaf3d6009006" defer></script>
</body>
</html>
