<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>T-ROOM Transfer | 構想中</title>
  <style>
    :root { color-scheme: light; font-family: "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; color: #17212a; background: #f3f6f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 80% 12%, rgba(26,117,109,.17), transparent 32%); }
    section { width: min(620px, 100%); padding: clamp(30px, 7vw, 58px); border: 1px solid #d7e2e0; border-radius: 22px; background: rgba(255,255,255,.94); box-shadow: 0 20px 50px rgba(20,36,44,.1); }
    a { color: inherit; }
    .brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 800; letter-spacing: .06em; }
    .brand span { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: white; background: #16756d; }
    .number { margin: 52px 0 10px; color: #16756d; font-size: .76rem; font-weight: 800; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: 1; letter-spacing: -.055em; }
    p { margin: 24px 0 0; color: #68737d; line-height: 1.9; }
    .status { display: inline-block; margin-top: 32px; padding: 8px 12px; border-radius: 999px; color: #0f5b55; background: #e4f3f0; font-size: .78rem; font-weight: 800; }
    .back { display: inline-block; margin-top: 38px; color: #0f5b55; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <a class="brand" href="/"><span>T</span>T-ROOM</a>
      <div class="number">08 / FILE TRANSFER</div>
      <h1>T-ROOM<br>Transfer</h1>
      <p>大容量ファイルを期限付きで受け渡すためのサービスです。現在は構想・設計中です。</p>
      <span class="status">COMING SOON</span><br>
      <a class="back" href="/">T-ROOMへ戻る</a>
    </section>
  </main>
</body>
</html>
