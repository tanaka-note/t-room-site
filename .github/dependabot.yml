version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/cloud-worker', '/security-worker', '/diary-worker', '/billing-worker', '/downloader-worker', '/ai-worker']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      runtime-and-tools:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
