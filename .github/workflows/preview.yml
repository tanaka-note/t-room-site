name: Public site Preview
on:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'site-worker/**'
      - 'apps/**'
      - 'assets/**'
      - 'learning/**'
      - 'diary/**'
      - 'transfer/**'
      - 'asset-report-*/**'
      - 'columns/**'
      - 'images/**'
      - 'tools/release.mjs'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
        working-directory: security-worker
      - name: Verify public site before uploading
        run: node tools/verify.mjs --target site --build
      - name: Upload version without production traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Preview not uploaded: configure preview environment CLOUDFLARE_PREVIEW_API_TOKEN. Local authenticated npm run preview remains available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          node tools/release.mjs preview site | tee "$RUNNER_TEMP/preview-output.txt"
          grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/preview-output.txt" | sort -u >> "$GITHUB_STEP_SUMMARY"
