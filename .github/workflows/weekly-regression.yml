name: Weekly cross-service regression
on:
  schedule:
    - cron: '20 21 * * 0' # Monday 06:20 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-cross-service
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [auth, backup, household, calendar, security, diary, cloud]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - name: Install selected dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: node tools/install-verify-dependencies.mjs "$TARGET"
      - name: Install fixture browser
        if: contains(fromJSON('["household","security","diary","cloud"]'), matrix.target)
        run: pnpm --dir diary-worker exec playwright install --with-deps chromium
      - name: Verify local fixtures
        env:
          TARGET: ${{ matrix.target }}
          CI: 'true'
          TROOM_BROWSER: chromium
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/weekly-regression.mjs "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weekly-${{ matrix.target }}
          path: |
            tmp/verify-artifacts/
            tmp/household-performance/
          if-no-files-found: ignore
          retention-days: 14
