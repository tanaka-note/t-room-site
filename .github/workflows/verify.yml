name: Verify changed services
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.plan.outputs.node }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {affected,changedFiles,targets,android} from './tools/verify-plan.mjs';
          import {appendFileSync} from 'node:fs';
          const selected=process.env.BASE_SHA ? affected(changedFiles(process.env.BASE_SHA,process.env.HEAD_SHA)) : targets;
          appendFileSync(process.env.GITHUB_OUTPUT,`node=${JSON.stringify(selected.filter(t=>!android.includes(t)))}\nandroid=${JSON.stringify(selected.filter(t=>android.includes(t)))}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Verify plan\n${selected.join(', ') || 'Documentation only: no tests required'}\n`);
          JS
  node:
    needs: plan
    if: needs.plan.outputs.node != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install only target dependencies
        env:
          VERIFY_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import {installDirectories} from './tools/verify-plan.mjs';
          import {execFileSync} from 'node:child_process';
          for(const cwd of installDirectories([process.env.VERIFY_TARGET])) execFileSync('pnpm',['install','--ignore-workspace','--frozen-lockfile','--ignore-scripts','--config.strict-dep-builds=false'],{cwd,stdio:'inherit'});
          JS
      - name: Install Chromium only when used
        if: contains(fromJSON('["tooling","cloud","security","diary"]'), matrix.target)
        run: pnpm --dir diary-worker exec playwright install --with-deps chromium
      - name: Syntax, tests, browser and dry-run build
        env:
          VERIFY_TARGET: ${{ matrix.target }}
          CI: 'true'
          TROOM_BROWSER: chromium
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/verify.mjs --target "$VERIFY_TARGET" --browser --build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verify-failure-${{ matrix.target }}
          path: tmp/verify-artifacts/
          if-no-files-found: ignore
          retention-days: 5
  android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.android) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Debug build and local unit tests (no signing secrets or emulator)
        env:
          VERIFY_TARGET: ${{ matrix.target }}
        run: node tools/verify.mjs --target "$VERIFY_TARGET"
  verify:
    if: always()
    needs: [plan, node, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          NODE: ${{ needs.node.result }}
          ANDROID: ${{ needs.android.result }}
        run: test "$PLAN" = success && [[ "$NODE" =~ ^(success|skipped)$ ]] && [[ "$ANDROID" =~ ^(success|skipped)$ ]]
