name: Verify changed services
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      production_target:
        description: 'Verify and release one main service (none = verification only)'
        type: choice
        default: none
        options: [none, site, cloud, security, diary, billing, downloader, downloader2, ai, inventory, health, payments, household, calendar]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.plan.outputs.node }}
      android: ${{ steps.plan.outputs.android }}
      downloader2_native: ${{ steps.plan.outputs.downloader2_native }}
      production: ${{ steps.plan.outputs.production }}
      downloader_production: ${{ steps.plan.outputs.downloader_production }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: plan
        env:
          VERIFY_EVENT: ${{ github.event_name }}
          VERIFY_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_TARGET: ${{ inputs.production_target || 'none' }}
          PRODUCTION_ENABLED: ${{ vars.CLOUDFLARE_PRODUCTION_ENABLED }}
        run: |
          node --input-type=module <<'JS'
          import {ciPlan,android} from './tools/verify-plan.mjs';
          import {productionPlan,manualVerification} from './tools/release-actions.mjs';
          import {appendFileSync} from 'node:fs';
          const requested=process.env.PRODUCTION_TARGET;
          const manual=process.env.VERIFY_EVENT==='workflow_dispatch' && requested!=='none';
          const {selected,native}=manual ? {selected:manualVerification(requested),native:requested==='downloader2'} : ciPlan({event:process.env.VERIFY_EVENT,ref:process.env.VERIFY_REF,base:process.env.BASE_SHA,head:process.env.HEAD_SHA});
          const production=productionPlan(selected,{event:process.env.VERIFY_EVENT,ref:process.env.VERIFY_REF,requested,enabled:process.env.PRODUCTION_ENABLED==='true'});
          const containerRelease=production.includes('downloader') && (manual || selected.includes('container-unit'));
          appendFileSync(process.env.GITHUB_OUTPUT,`production=${JSON.stringify(production.filter(t=>t!=='downloader' || !containerRelease))}\ndownloader_production=${containerRelease}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`node=${JSON.stringify(selected.filter(t=>!android.includes(t)))}\nandroid=${JSON.stringify(selected.filter(t=>android.includes(t)))}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`downloader2_native=${native}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Verify plan\n${selected.join(', ') || 'Documentation only: no tests required'}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Production plan\n${production.join(', ') || 'No production deployment selected (or production disabled)'}\n`);
          JS
  node:
    needs: plan
    if: needs.plan.outputs.node != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.node) }}
    # Shared Playwright 1.56.1 does not support the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install only target dependencies
        env:
          VERIFY_TARGET: ${{ matrix.target }}
        run: node tools/install-verify-dependencies.mjs "$VERIFY_TARGET"
      - name: Keep Ubuntu browser dependency downloads bounded
        if: contains(fromJSON('["tooling","site","cloud","security","diary","billing","health","payments","household","portfolio","inventory"]'), matrix.target)
        run: |
          # The Azure mirror stalled installs past the job limit. Preserve suites,
          # components and Signed-By; use the official archive over HTTPS.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
          done
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99troom-network >/dev/null
      - name: Install Chromium only when used
        if: contains(fromJSON('["tooling","site","cloud","security","diary","billing","health","payments","household","portfolio"]'), matrix.target)
        run: pnpm --dir diary-worker exec playwright install --with-deps chromium
      - name: Install Inventory Chromium
        if: matrix.target == 'inventory'
        run: pnpm --dir inventory-worker exec playwright install --with-deps chromium
      - name: Install Cloud seek fixture and WebKit dependencies
        if: matrix.target == 'cloud'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gstreamer1.0-libav gstreamer1.0-gl pulseaudio pulseaudio-utils
          pnpm --dir diary-worker exec playwright install chrome
          pnpm --dir diary-worker exec playwright install --with-deps webkit
      - name: Syntax, tests, browser and dry-run build
        env:
          VERIFY_TARGET: ${{ matrix.target }}
          CI: 'true'
          TROOM_BROWSER: chromium
          WRANGLER_SEND_METRICS: 'false'
          TROOM_CHROMIUM_CHANNEL: ${{ matrix.target == 'cloud' && 'chrome' || '' }}
        run: node tools/verify.mjs --target "$VERIFY_TARGET" --browser --build
      - name: Start Cloud WebKit audio device
        if: matrix.target == 'cloud'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tcloud_ci rate=44100 channels=2
          pactl set-default-sink tcloud_ci
          pactl info
          pactl list short sinks
      - name: Cloud Linux WebKit TS remux regression
        if: matrix.target == 'cloud'
        env:
          TROOM_BROWSER: webkit
          TROOM_SEEK_CASE: ts
          TROOM_TRACE_DIR: tmp/verify-artifacts/webkit-ts
          CI: 'true'
        run: timeout -k 10s 5m node --require ./tools/browser-trace.cjs cloud-worker/tests/media-seek.browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verify-failure-${{ matrix.target }}
          path: tmp/verify-artifacts/
          if-no-files-found: ignore
          retention-days: 5
  inventory-webkit-macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.node), 'inventory')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install only Inventory dependencies
        run: node tools/install-verify-dependencies.mjs inventory
      - name: Install Inventory WebKit
        run: pnpm --dir inventory-worker exec playwright install webkit
      - name: Inventory macOS WebKit regression
        timeout-minutes: 5
        env:
          TROOM_BROWSER: webkit
          TROOM_TRACE_DIR: tmp/verify-artifacts/inventory-webkit-macos
          CI: 'true'
        run: node --require ./tools/browser-trace.cjs inventory-worker/test/inventory.browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verify-failure-inventory-webkit-macos
          path: tmp/verify-artifacts/inventory-webkit-macos/
          if-no-files-found: ignore
          retention-days: 5
  household-webkit-macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.node), 'household')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install only Household dependencies
        run: node tools/install-verify-dependencies.mjs household
      - name: Install Household WebKit
        run: pnpm --dir diary-worker exec playwright install webkit
      - name: Household macOS WebKit regression
        timeout-minutes: 5
        env:
          TROOM_BROWSER: webkit
          TROOM_TRACE_DIR: tmp/verify-artifacts/household-webkit-macos
          CI: 'true'
        run: node --require ./tools/browser-trace.cjs household-worker/test/household.browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verify-failure-household-webkit-macos
          path: tmp/verify-artifacts/household-webkit-macos/
          if-no-files-found: ignore
          retention-days: 5
  cloud-webkit-macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.node), 'cloud')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TROOM_AUDIO_LOOPBACK: BlackHole 2ch
      TROOM_AUDIO_CAPTURE_BIN: tmp/ci-audio-loopback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install native platform comparison dependencies
        run: |
          node tools/install-verify-dependencies.mjs cloud
          brew install ffmpeg-full switchaudio-osx coreutils
          brew install blackhole-2ch
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          sudo killall -9 coreaudiod
          for attempt in {1..10}; do
            if SwitchAudioSource -a -t output | grep -Fx 'BlackHole 2ch'; then break; fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          SwitchAudioSource -s 'BlackHole 2ch' -t system
          SwitchAudioSource -c -t output
          mkdir -p tmp
          clang -O2 -std=c11 -Wall -framework CoreAudio -framework CoreFoundation cloud-worker/tests/media-audio-loopback.c -o tmp/ci-audio-loopback
          pnpm --dir diary-worker exec playwright install webkit
      - name: Calibrate actual audio output independently of WebKit
        env:
          CI: 'true'
        run: node --input-type=module -e "import { calibrateFixtureAudioOutput } from './cloud-worker/tests/media-audio-loopback.mjs'; await calibrateFixtureAudioOutput();"
      - name: Cloud macOS WebKit listing isolation
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: gtimeout -k 10s 2m node cloud-worker/tests/listing-boundary.browser.mjs
      - name: Cloud macOS WebKit selection isolation
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: gtimeout -k 10s 2m node cloud-worker/tests/selection-boundary.browser.mjs
      - name: Cloud macOS WebKit photo fullscreen and wheel zoom
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: gtimeout -k 10s 2m node cloud-worker/tests/photo-fullscreen.browser.mjs
      - name: Cloud macOS WebKit native control
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: gtimeout -k 10s 5m node cloud-worker/tests/media-seek.browser.mjs --minimal-native
      - name: Cloud macOS WebKit full media regression
        if: ${{ !cancelled() }}
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: gtimeout -k 10s 5m node cloud-worker/tests/media-seek.browser.mjs
      - name: Install isolated current macOS WebKit comparison
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npm install --prefix tmp/webkit-version --ignore-scripts --no-audit --no-fund playwright@1.63.0
          node tmp/webkit-version/node_modules/playwright/cli.js install webkit
      - name: Cloud current macOS WebKit full media comparison
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TROOM_BROWSER: webkit
          CI: 'true'
        run: TROOM_PLAYWRIGHT_PATH="$PWD/tmp/webkit-version/node_modules/playwright" gtimeout -k 10s 5m node cloud-worker/tests/media-seek.browser.mjs
  android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.android) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Debug build and local unit tests (no signing secrets or emulator)
        env:
          VERIFY_TARGET: ${{ matrix.target }}
        run: node tools/verify.mjs --target "$VERIFY_TARGET"
  downloader2-native:
    needs: plan
    if: needs.plan.outputs.downloader2_native == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Native solution
        shell: pwsh
        run: dotnet build downloader2-native/Tlain.Downloader2.slnx --configuration Release -warnaserror
      - name: Run Native tests
        shell: pwsh
        run: dotnet run --project downloader2-native/tests/Tlain.Downloader2.Tests/Tlain.Downloader2.Tests.csproj --configuration Release --no-build
      - name: Publish Native Host
        shell: pwsh
        run: dotnet publish downloader2-native/src/Tlain.Downloader2.Host/Tlain.Downloader2.Host.csproj --configuration Release --no-build --output downloader2-native/artifacts/host
      - name: Smoke test Native Messaging
        shell: pwsh
        run: node downloader2-native/tests/native-host-smoke.mjs direct downloader2-native/artifacts/host/Tlain.Downloader2.Host.exe
      - name: Build isolated E2E profile
        shell: pwsh
        run: dotnet build downloader2-native/src/Tlain.Downloader2.Host/Tlain.Downloader2.Host.csproj --configuration Release -warnaserror -p:Downloader2Profile=E2E -p:Downloader2PairingEndpoint=https://isolated-preview.example.invalid/downloader2/api/pairing/redeem -p:Downloader2PairingAllowedHosts=isolated-preview.example.invalid --output downloader2-native/artifacts/e2e-host
  verify:
    if: always()
    needs: [plan, node, inventory-webkit-macos, household-webkit-macos, cloud-webkit-macos, android, downloader2-native]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          NODE: ${{ needs.node.result }}
          MACOS: ${{ needs.cloud-webkit-macos.result }}
          HOUSEHOLD_MACOS: ${{ needs.household-webkit-macos.result }}
          INVENTORY_MACOS: ${{ needs.inventory-webkit-macos.result }}
          ANDROID: ${{ needs.android.result }}
          DOWNLOADER2_NATIVE: ${{ needs.downloader2-native.result }}
        run: test "$PLAN" = success && [[ "$NODE" =~ ^(success|skipped)$ ]] && [[ "$HOUSEHOLD_MACOS" =~ ^(success|skipped)$ ]] && [[ "$INVENTORY_MACOS" =~ ^(success|skipped)$ ]] && [[ "$MACOS" =~ ^(success|skipped)$ ]] && [[ "$ANDROID" =~ ^(success|skipped)$ ]] && [[ "$DOWNLOADER2_NATIVE" =~ ^(success|skipped)$ ]]
  production:
    needs: [plan, verify]
    if: ${{ !cancelled() && github.repository == 'tanaka-note/t-room-site' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.plan.outputs.production != '[]' }}
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.production) }}
    concurrency:
      group: ${{ matrix.target == 'downloader' && 'clamav-definition-update' || format('production-{0}', matrix.target) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - name: Install only verified target dependencies
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: node tools/install-verify-dependencies.mjs "$RELEASE_TARGET"
      - name: Prepare site from the verified commit
        if: matrix.target == 'site'
        run: node tools/prepare-static-assets.mjs
      - name: Check least-privilege token (manual initial verification)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release-actions.mjs --check-token
      - name: Publish selected Worker and verify production
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          TROOM_CI_RESULT: ${{ needs.verify.result }}
          TROOM_VERIFIED_SHA: ${{ github.sha }}
          TROOM_DOWNLOADER_WORKER_ONLY: ${{ matrix.target == 'downloader' && 'true' || 'false' }}
          CLOUDFLARE_API_TOKEN: ${{ matrix.target == 'downloader' && secrets.CLAMAV_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/release-actions.mjs "$RELEASE_TARGET"
  downloader-production:
    needs: [plan, verify]
    if: ${{ !cancelled() && github.repository == 'tanaka-note/t-room-site' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && needs.plan.outputs.downloader_production == 'true' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/clamav-definitions.yml
    with:
      release_code: true
      verified_sha: ${{ github.sha }}
    secrets:
      CLAMAV_CLOUDFLARE_API_TOKEN: ${{ secrets.CLAMAV_CLOUDFLARE_API_TOKEN }}
