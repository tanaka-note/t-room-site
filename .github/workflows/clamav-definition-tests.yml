name: ClamAV definition tests
on:
  push:
    branches: [main]
    paths:
      - 'downloader-worker/tools/**'
      - 'downloader-worker/test/definition-updates.test.js'
      - 'security-worker/src/definition-status.js'
      - 'security-worker/migrations/**'
      - '.github/workflows/clamav-definition*.yml'
  pull_request:
    paths:
      - 'downloader-worker/tools/**'
      - 'downloader-worker/test/definition-updates.test.js'
      - 'security-worker/src/definition-status.js'
      - 'security-worker/migrations/**'
      - '.github/workflows/clamav-definition*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test downloader-worker/test/definition-updates.test.js
