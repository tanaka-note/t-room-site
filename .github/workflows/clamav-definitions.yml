name: ClamAV daily definitions
on:
  workflow_call:
    inputs:
      release_code:
        type: boolean
        required: true
      verified_sha:
        type: string
        required: true
    secrets:
      CLAMAV_CLOUDFLARE_API_TOKEN:
        required: true
  schedule:
    - cron: '37 19 * * *' # 04:37 JST, once per day
  workflow_dispatch:
    inputs:
      release_code:
        description: 'Build and verify the checked-out Downloader Container code before rollout'
        type: boolean
        default: false
      analysis_only:
        description: 'With release_code: replace only analysis Python code, preserving verified runtime and definitions'
        type: boolean
        default: false
      reconcile_only:
        description: 'Resume a pending definition intent without building a new candidate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: clamav-definition-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Require the latest verified main for automatic code release
        if: inputs.verified_sha != ''
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$VERIFIED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$VERIFIED_SHA"
      - run: node downloader-worker/tools/refresh-definitions.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLAMAV_CLOUDFLARE_API_TOKEN }}
          RELEASE_CONTAINER_CODE: ${{ (github.event_name == 'workflow_dispatch' || inputs.verified_sha != '') && inputs.release_code && 'true' || 'false' }}
          RELEASE_ANALYSIS_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.analysis_only && 'true' || 'false' }}
          RECONCILE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_only && 'true' || 'false' }}
  notify:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: clamav-definition-notification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node downloader-worker/tools/monitor-definitions.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLAMAV_CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
