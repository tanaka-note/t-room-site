<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090d">
  <meta name="troom-app-build" content="asset-report-db02d41abc1d">
  <meta name="troom-service-worker" content="./service-worker.js?v=asset-report-db02d41abc1d">
  <meta name="application-name" content="資産運用報告">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="資産報告">
  <title>資産運用報告ページ</title>
  <meta name="description" content="月次の資産運用状況を記録する報告ページです。">
  <link rel="manifest" href="./manifest.webmanifest?v=asset-report-db02d41abc1d">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=20260812-2">
  <link rel="icon" href="./icons/favicon-32.png?v=20260812-2" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="./report.css?v=asset-report-db02d41abc1d">
  <meta name="troom-auto-update" content="enabled">
</head>
<body>
  <main class="report-shell">
    <header class="report-header">
      <div>
        <p class="eyebrow">MONTHLY PORTFOLIO REPORT</p>
        <h1><span>資産運用</span><span>報告ページ</span></h1>
      </div>
      <div class="report-period" aria-label="集計時点">
        <span>AS OF</span>
        <time datetime="2026-08-17">2026.08.17</time>
        <button id="install-app-button" class="install-app-button" type="button">ホームへ追加</button>
        <small>8月17日時点</small>
      </div>
    </header>

    <section class="summary-section" aria-labelledby="summary-title">
      <h2 id="summary-title" class="visually-hidden">資産運用状況の概要</h2>
      <div class="summary-grid">
        <article class="summary-card">
          <span>元本</span>
          <strong id="principal-value">—</strong>
        </article>
        <article class="summary-card summary-card-primary">
          <span>時価総額</span>
          <strong id="market-value">—</strong>
        </article>
        <article class="summary-card">
          <span>損益</span>
          <strong id="profit-value">—</strong>
        </article>
        <article class="summary-card">
          <span>損益率</span>
          <strong id="return-value">—</strong>
        </article>
      </div>
    </section>

    <section id="history-section" class="report-panel history-panel" aria-labelledby="history-title" hidden>
      <div class="section-heading">
        <div>
          <p class="section-kicker">PORTFOLIO TREND</p>
          <h2 id="history-title">資産推移</h2>
        </div>
        <p id="history-period">集計期間を読み込み中</p>
      </div>
      <div id="history-range-controls" class="range-controls" aria-label="資産推移の表示期間">
        <button type="button" data-history-range="7d" aria-pressed="false">1週間</button>
        <button type="button" data-history-range="1m" aria-pressed="false">1ヶ月</button>
        <button type="button" data-history-range="all" class="is-active" aria-pressed="true">すべて</button>
      </div>
      <div class="chart-frame chart-frame-history">
        <canvas id="history-chart" role="img" aria-label="時価総額の日次推移"></canvas>
        <div id="history-tooltip" class="chart-tooltip" role="status" hidden></div>
      </div>
      <p id="history-summary" class="visually-hidden"></p>
      <div class="history-legend" aria-label="チャートの凡例">
        <span><i class="history-dot history-dot-market" aria-hidden="true"></i>時価総額</span>
      </div>
    </section>

    <section class="report-panel allocation-panel" aria-labelledby="allocation-title">
      <div class="section-heading">
        <div>
          <p class="section-number" id="allocation-number">01</p>
          <h2 id="allocation-title">資産構成</h2>
        </div>
        <p>時価総額に占める割合</p>
      </div>

      <div class="allocation-layout">
        <div class="donut-wrap">
          <canvas id="allocation-chart" role="img" aria-label="銘柄ごとの資産構成比"></canvas>
          <div class="donut-center" aria-hidden="true">
            <span>MARKET VALUE</span>
            <strong id="donut-total">—</strong>
          </div>
        </div>
        <ol id="allocation-legend" class="allocation-legend" aria-label="資産構成比の内訳"></ol>
      </div>
    </section>

    <section class="report-panel holdings-panel" aria-labelledby="holdings-title">
      <div class="section-heading">
        <div>
          <p class="section-number" id="holdings-number">02</p>
          <h2 id="holdings-title">保有資産</h2>
        </div>
        <p>2026年8月17日時点</p>
      </div>

      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="column-name">
            <col class="column-market-value">
            <col class="column-profit">
            <col class="column-return">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">銘柄名</th>
              <th scope="col">時価総額</th>
              <th scope="col">損益</th>
              <th scope="col">損益率</th>
            </tr>
          </thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </section>

    <section id="comment-section" class="report-panel comment-panel" aria-labelledby="comment-title" hidden>
      <div class="section-heading">
        <div>
          <p class="section-number" id="comment-number">03</p>
          <h2 id="comment-title">月次レポート</h2>
        </div>
      </div>
      <article class="monthly-report">
        <div id="monthly-report-entries" class="monthly-report-entries"></div>
        <p class="report-updated">更新日：<time id="report-updated" datetime="2026-08-02">2026年8月2日</time></p>
      </article>
    </section>
  </main>

  <script src="./report.js?v=asset-report-db02d41abc1d"></script>
  <script src="./pwa.js?v=asset-report-db02d41abc1d"></script>
  <script src="/assets/pwa-auto-update.js?v=asset-report-db02d41abc1d" defer></script>
</body>
</html>
