<meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">

<body>
<main class="shell">
  <header><div><a class="brand" href="/">T-lain</a><h1>在庫照会</h1><p>日用品・消耗品の在庫と使用数</p></div><div class="account"><span id="account-name"></span><button id="logout" hidden>ログアウト</button></div></header>
  <p id="message" role="status" aria-live="polite">読み込み中…</p>
  <section id="login-view" class="panel" hidden>
    <h2>パスキーでログイン</h2><p>ご自身の在庫と使用履歴を確認できます。</p>
    <button id="login" class="primary">パスキーでログイン</button>
  </section>
  <section id="app-view" hidden>
    <div id="list-view">
      <div class="toolbar"><label>品目を検索<input id="search" type="search" placeholder="品目名" autocomplete="off"></label><label>集計年<select id="list-year" aria-label="一覧の集計年"></select></label><button id="add-item" class="primary">品目を追加</button></div>
      <label class="archive-filter"><input type="checkbox" id="show-archived"> アーカイブ済みも表示</label>
      <div id="items" class="items"></div>
    </div>
    <section id="detail-view" hidden>
      <button id="back" class="back">← 一覧へ戻る</button>
      <div class="detail-heading"><div><h2 id="item-name"></h2><p id="item-stock"></p></div><div id="detail-actions"></div></div>
      <section class="panel"><div class="toolbar"><label>集計年<select id="detail-year" aria-label="詳細の集計年"></select></label><p id="annual-total" class="total"></p></div><h3>月別の使用数</h3>
        <svg id="chart" viewBox="0 0 640 220" role="img" aria-label="月別使用数の棒グラフ"></svg>
        <div class="table-wrap"><table><caption class="sr-only">月別使用数</caption><thead><tr id="month-labels"></tr></thead><tbody><tr id="month-values"></tr></tbody></table></div>
      </section>
      <section class="panel"><h3>記録</h3><div id="movements"></div><button id="more" hidden>さらに読み込む</button></section>
    </section>
  </section>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="record-form">
  <fieldset id="fields"><div class="dialog-title"><h2 id="editor-title"></h2><button type="button" id="close-editor" aria-label="閉じる">×</button></div>
  <div id="name-fields"><label>品目名<input id="name" maxlength="100" autocomplete="off"></label><label>単位<input id="unit" value="個" maxlength="12" autocomplete="off"></label></div>
  <label><span id="quantity-label">数量</span><input id="quantity" type="number" min="0" max="1000000000" step="1" required inputmode="numeric"></label>
  <label id="time-field">日時<input id="occurred-at" type="datetime-local" step="1" required></label>
  <p id="form-message" role="alert"></p><button type="submit" class="primary" id="save">記録する</button>
  </fieldset>
</form></dialog>
